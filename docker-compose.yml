services:
  postgres:
    image: postgres:16
    container_name: solsniper-postgres
    restart: always
    environment:
      POSTGRES_USER: solsniper
      POSTGRES_PASSWORD: solsniper_password
      POSTGRES_DB: solsniper_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: